# This rule is not used by the project s3-batch-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the batch.batch.operator.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: s3-batch-operator
    app.kubernetes.io/managed-by: kustomize
  name: s3batchjob-editor-role
rules:
- apiGroups:
  - batch.batch.operator
  resources:
  - s3batchjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch.batch.operator
  resources:
  - s3batchjobs/status
  verbs:
  - get
