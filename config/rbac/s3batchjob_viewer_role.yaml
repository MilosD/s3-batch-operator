# This rule is not used by the project s3-batch-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to batch.batch.operator resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: s3-batch-operator
    app.kubernetes.io/managed-by: kustomize
  name: s3batchjob-viewer-role
rules:
- apiGroups:
  - batch.batch.operator
  resources:
  - s3batchjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch.batch.operator
  resources:
  - s3batchjobs/status
  verbs:
  - get
